# Runs when someone sends a game through the form: check it, store it, retrain the AI, reply, publish.
name: Game

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# one game at a time, in the order they arrive: two games never write the data at the same moment
concurrency:
  group: games
  cancel-in-progress: false

jobs:
  game:
    if: contains(github.event.issue.body, '### Game')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.store.outputs.status }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: trainer/requirements-ci.txt
      - name: Install PyTorch (CPU) and helpers
        run: |
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          pip install --quiet -r trainer/requirements-ci.txt

      # The form text is written by a stranger. It only ever travels in an environment variable.
      - name: Check the game
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node engine/scripts/check-game.ts > "$RUNNER_TEMP/check.json"

      - name: Store, retrain, rebuild
        id: store
        env:
          PLAYER_SALT: ${{ secrets.PLAYER_SALT }}
          GAME_URL: ${{ vars.GAME_URL }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          USER_ID: ${{ github.event.issue.user.id }}
          LOGIN: ${{ github.event.issue.user.login }}
        working-directory: trainer
        run: |
          status=$(python -m rps.process --check "$RUNNER_TEMP/check.json" --data ../data \
            --issue "$ISSUE_NUMBER" --user-id "$USER_ID" --login "$LOGIN" --reply "$RUNNER_TEMP/reply.md" | tail -1)
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Redraw the scoreboard
        if: steps.store.outputs.status == 'stored'
        working-directory: trainer
        run: python -m rps.scoreboard --stats ../data/stats.json --out ../media

      - name: Save the data
        if: steps.store.outputs.status == 'stored'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data media
          git commit -m "data: add game from form $ISSUE_NUMBER"
          git push

      - name: Reply and close the form
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          test -s "$RUNNER_TEMP/reply.md" || echo "Something went wrong on my side and this game was not counted. Igor will have a look." > "$RUNNER_TEMP/reply.md"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/reply.md"
          gh issue close "$ISSUE_NUMBER" --repo "$REPO"

  # Starts the Publish job as a run of its own. Calling it from inside this run made its last step fail:
  # it could not find the page files it had just uploaded.
  publish:
    needs: game
    if: needs.game.outputs.status == 'stored' && vars.PAGES == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the Publish job
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run publish.yml --repo "$REPO" --ref main
